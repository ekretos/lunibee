name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Bun typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun run ci:install

      - name: Validate dependency graph
        run: bun run check:deps

      - name: Check formatting
        run: bun run format:check

      - name: Audit public API
        run: bun run audit:api

      - name: REST coverage report is current
        run: bun run audit:coverage

      - name: Security audit (dependencies, secrets, risky APIs)
        run: bun run audit:security

      - name: Typecheck every workspace package
        shell: bash
        run: |
          set -euo pipefail
          for package in packages/*; do
            if [ -f "$package/package.json" ] && [ -d "$package/src" ]; then
              echo "==> Typechecking $package"
              mapfile -t sources < <(find "$package/src" -type f -name '*.ts' -print)
              if [ "${#sources[@]}" -gt 0 ]; then
                bunx tsc --noEmit \
                  --ignoreConfig \
                  --target ESNext \
                  --module ESNext \
                  --moduleResolution Bundler \
                  --strict \
                  --skipLibCheck \
                  --types bun \
                  "${sources[@]}"
              fi
            fi
          done

      - name: Typecheck root entrypoint
        run: bunx tsc --noEmit --project tsconfig.json

  test:
    name: Bun test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun run ci:install

      - name: Run test suite
        run: bun run ci:test

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun run ci:install

      - name: Run benchmarks
        shell: bash
        run: |
          set -o pipefail
          {
            echo "## Benchmarks"
            echo '```'
            bun run bench
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compare with the committed baseline (warns, never fails)
        shell: bash
        run: |
          set -o pipefail
          bun run build
          {
            echo "## Runtime benchmark vs baseline"
            echo '```'
            bun run bench:compare
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack every package and install it into an empty project
        run: bun run smoke:install
